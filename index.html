<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de senhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
  <h1>Gerador de Senhas</h1>
  <img src="Gemini_Generated_Image_qqh5y3qqh5y3qqh5.png" alt="Gerador de senhas">
   <div class="card">
      <label for="length">Tamanho da Senha:</label>
      <input type="number" id="length" min="4" max="32" value="12">
  
  </div>
  <div class="options">
     <label><input type="checkbox" id= "uppercase" checked> Maiúsculas</label>
     <label><input type="checkbox" id= "numbers" checked> Números</label>
     <label><input type="checkbox" id= "symbols" checked> Símbolos</label>
  </div>
</body>
</html>
